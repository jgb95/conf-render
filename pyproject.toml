[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conf-render"
version = "0.1.0"
description = "Render conference videos from a declarative JSON manifest"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conf-render = "conf_render.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conf_render"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
